name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pure-suites:
    name: Pure test suites (NumPy + GDAL, no QGIS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install NumPy, GDAL and SciPy (SciPy is an optional accelerator)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-numpy python3-gdal python3-scipy
      - name: Run suites (with SciPy)
        run: bash tools/dev/ci_pure.sh
      - name: Run suites again without SciPy (the NumPy / GDAL fallbacks)
        run: FLOODDEPTH_NO_SCIPY=1 bash tools/dev/ci_pure.sh

  bandit:
    name: Bandit security scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -q -r . -x ./tests,./tools
